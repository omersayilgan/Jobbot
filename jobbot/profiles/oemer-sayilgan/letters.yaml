# ====================================================================
#  letters.yaml — generated by setup.py
#
#  Cover-letter evidence, in your own words, taken from your CV.
#  Edit freely: setup.py never overwrites a profile without --force,
#  and `--regenerate` rebuilds only from profile.yaml.
# ====================================================================

languages:
- en
- de
needs_translation:
  en: false
  de: true
templates:
  en: '{date}


    Application: {title}

    {company}{ref}


    Dear Hiring Team,


    I am applying for the position of {title} at {company}. I am {headline}, and the role''s focus on
    {focus} lines up closely with my background and my hands-on experience.


    {evidence}


    What draws me to {company} specifically is the opportunity to apply this experience to work that ships
    rather than to exercises. I am based in {city}, available for a full-time start, and {language_note}.


    I would welcome the opportunity to discuss how I can contribute to your team.


    Kind regards,

    {full_name}

    {phone} | {email}

    {address}

    '
  de: '{date}


    Bewerbung als {title}

    {company}{ref}


    Sehr geehrtes Recruiting-Team,


    hiermit bewerbe ich mich auf die Position als {title} bei {company}. Ich bin {headline}, und der Schwerpunkt
    der Stelle auf {focus} passt sehr gut zu meinem Hintergrund und meiner praktischen Erfahrung.


    {evidence}


    Besonders reizt mich an {company} die Möglichkeit, diese Erfahrung in einem Umfeld einzusetzen, in
    dem Ergebnisse tatsächlich ausgeliefert werden. Ich wohne in {city}, stehe für einen Vollzeiteinstieg
    zur Verfügung und {language_note}.


    Über die Gelegenheit zu einem persönlichen Gespräch würde ich mich sehr freuen.


    Mit freundlichen Grüßen

    {full_name}

    {phone} | {email}

    {address}

    '
language_notes:
  en: work comfortably in English, with German at B1 and improving
  de: arbeite sicher auf Englisch; meine Deutschkenntnisse liegen bei B1 und verbessern sich stetig
evidence:
  control_gnc:
    en: 'My hands-on work in control systems and GNC includes: designed PID and Robust Controllers for
      a high-precision missile seeker gimbal system using classical and modern control techniques; and
      conducted Real-Time (RT) testing and PID tuning via xPC Target and Hardware-in-the-Loop (HIL) setups.
      Master’s Thesis (ongoing): Fault-Tolerant Control of Propulsive Spacecraft Systems – categorizing
      spacecraft dynamics and control redundancies, simulating fault scenarios, and evaluating their effect
      on path planning. Academically this is backed by Dynamics (BA), Control Systems (BA).'
    de: 'Meine praktische Erfahrung in Regelungstechnik und GNC umfasst: designed PID and Robust Controllers
      for a high-precision missile seeker gimbal system using classical and modern control techniques;
      and conducted Real-Time (RT) testing and PID tuning via xPC Target and Hardware-in-the-Loop (HIL)
      setups. Master’s Thesis (ongoing): Fault-Tolerant Control of Propulsive Spacecraft Systems – categorizing
      spacecraft dynamics and control redundancies, simulating fault scenarios, and evaluating their effect
      on path planning. Fachlich untermauert durch Dynamics (BA), Control Systems (BA).'
  simulation_mbd:
    en: 'My hands-on work in model-based design and simulation includes: developed and simulated dynamic
      models in MATLAB/Simulink for performance analysis and controller validation; and generated Embedded
      C code from Simulink models and deployed onto Xilinx hardware platforms. Semester Thesis: Extended
      an automated signal integrity check toolbox at the Institute of Flight System Dynamics – developed
      MATLAB OOP classes, automated Simulink model generation via scripts, and implemented V-Model-based
      testing with code compliance (Mrails) and test harness structures. Academically this is backed by
      MATLAB / Simulink for Computer Aided Engineeri (2.0), Numerical Methods (CB).'
    de: 'Meine praktische Erfahrung in modellbasierte Entwicklung und Simulation umfasst: developed and
      simulated dynamic models in MATLAB/Simulink for performance analysis and controller validation;
      and generated Embedded C code from Simulink models and deployed onto Xilinx hardware platforms.
      Semester Thesis: Extended an automated signal integrity check toolbox at the Institute of Flight
      System Dynamics – developed MATLAB OOP classes, automated Simulink model generation via scripts,
      and implemented V-Model-based testing with code compliance (Mrails) and test harness structures.
      Fachlich untermauert durch MATLAB / Simulink for Computer Aided Engineeri (2.0), Numerical Methods
      (CB).'
  devops_cloud:
    en: 'My hands-on work in cloud infrastructure and DevOps includes: built data pipelines from PLC to
      InfluxDB using the PyADS Python library; designed real-time monitoring dashboards using Grafana
      and InfluxQL; and deployed local database environments using Docker, Proxmox, and Linux networking.
      Academically this is backed by Introduction to ROS (Robot Operating System) (1.0), Einführung in
      ROS (Robot Operating System) (1.0).'
    de: 'Meine praktische Erfahrung in Cloud-Infrastruktur und DevOps umfasst: built data pipelines from
      PLC to InfluxDB using the PyADS Python library; designed real-time monitoring dashboards using Grafana
      and InfluxQL; and deployed local database environments using Docker, Proxmox, and Linux networking.
      Fachlich untermauert durch Introduction to ROS (Robot Operating System) (1.0), Einführung in ROS
      (Robot Operating System) (1.0).'
  software_engineering:
    en: 'My background in software engineering is academic so far: Introduction to ROS (Robot Operating
      System) (1.0), Einführung in ROS (Robot Operating System) (1.0), Advanced Programming (1.7).'
    de: 'Mein Hintergrund in Softwareentwicklung ist bislang akademisch: Introduction to ROS (Robot Operating
      System) (1.0), Einführung in ROS (Robot Operating System) (1.0), Advanced Programming (1.7).'
  automation_plc:
    en: 'My hands-on work in industrial automation and test systems includes: developed TwinCAT 3.1 (Structured
      Text) logic for an absorber testbench; calibrated RS-485 industrial sensors using serial communication
      tools; and integrated and wired sensors with Beckhoff I/O terminals via circuit diagrams. Academically
      this is backed by Mechatronic Design (BB).'
    de: 'Meine praktische Erfahrung in Industrieautomatisierung und Teststandstechnik umfasst: developed
      TwinCAT 3.1 (Structured Text) logic for an absorber testbench; calibrated RS-485 industrial sensors
      using serial communication tools; and integrated and wired sensors with Beckhoff I/O terminals via
      circuit diagrams. Fachlich untermauert durch Mechatronic Design (BB).'
  embedded_realtime:
    en: 'My background in embedded and real-time software is academic so far: Introduction to ROS (Robot
      Operating System) (1.0), Einführung in ROS (Robot Operating System) (1.0), Logic Design (CC).'
    de: 'Mein Hintergrund in Embedded- und Echtzeitsoftware ist bislang akademisch: Introduction to ROS
      (Robot Operating System) (1.0), Einführung in ROS (Robot Operating System) (1.0), Logic Design (CC).'
  robotics_autonomy:
    en: 'My background in robotics and autonomous systems is academic so far: Introduction to ROS (Robot
      Operating System) (1.0), Einführung in ROS (Robot Operating System) (1.0).'
    de: 'Mein Hintergrund in Robotik und autonome Systeme ist bislang akademisch: Introduction to ROS
      (Robot Operating System) (1.0), Einführung in ROS (Robot Operating System) (1.0).'
