  gap_concentrated: Almost all of these mentions come from {top_company}. That is one employer's house
    style, not market demand — learn it only if you are set on them.
  gap_narrow: Asked for by {jobs} role(s), from {companies} employer(s). Worth a conceptual grounding
    rather than real investment.
  gap_core: This sits inside {group}, which is your own field — a gap here is more visible to an interviewer
    than the same gap elsewhere. Treat it as a priority.
  partial_broad: You have adjacent evidence ({note}). Turning that into one demonstrable artefact — a
    repository, a certificate, a finished side project — converts a 'partial' into a 'have' for {jobs}
    roles at once.
  partial_narrow: Adjacent evidence already ({note}); low effort to finish, but only {jobs} role(s) here
    ask for it.
  have: Already evidenced. Make sure the CV says so in the posting's own vocabulary — {jobs} of these
    roles use this exact term.
