# ---------- seniority fit ----------
seniority:
  # You are an early-career hire: reward entry-level, penalise deep-senior.
  boost:
    12: [graduate, entry level, entry-level, junior, absolvent, berufseinsteiger,
         "0-2 years", "1-2 years", "1-3 years", "2 years of experience"]
  penalty:
    -30: [principal, staff engineer, head of, director, vp of, chief,
          "10+ years", "10 years of experience", "8+ years", teamleitung, team lead]
    -16: [senior, lead engineer, expert, "5+ years", "5 years of experience",
          "6+ years", "7+ years", erfahren]

# ---------- language requirement realism ----------
# Your German is B1. A posting demanding C1/native German is a long shot;
# it is not dropped, just down-weighted so it ranks below realistic ones.
language:
  penalty:
    -22: [fließend deutsch, fliessend deutsch, verhandlungssicher,
          deutsch c1, deutsch c2, german c1, german c2,
          native german, muttersprache deutsch, sehr gute deutschkenntnisse]
    -8: [gute deutschkenntnisse, german language skills, deutschkenntnisse]
  boost:
    10: [english is our company language, english-speaking, no german required,
         company language is english, working language is english,
         english as the working language]

