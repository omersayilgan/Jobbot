# ============================================================
#  Profession & skill ontology
#
#  This file is the tool's knowledge of the working world. `setup.py` matches
#  a CV and transcripts against it to decide which domains a person actually
#  has evidence for, then generates a personal config from the domains that hit.
#
#  Schema per domain:
#    label        human name, used as the taxonomy group heading
#    family       broad sector, used for peer/aggregator query grouping
#    titles       job-title phrases that mean "this role IS this domain"
#    focus        cover-letter phrase, per language
#    blurb        one clause describing the domain, used in generated narrative
#    skills       {skill name: [posting terms]} — the scoring + gap vocabulary
#    course_terms words that appear in *transcript course names* for this domain
#                 (deliberately different vocabulary from job postings)
#    tools        named tools/products; a CV hit here is strong evidence
#
#  Add a domain by copying the shape. Nothing in the code hardcodes a domain
#  name, so a new entry is picked up automatically.
# ============================================================

