# ============================================================
#  Metro-area definitions.
#
#  A job's location string is messy ("Ottobrunn, Bavaria, Germany",
#  "Greater London", "Germany - remote"). Setup picks the metro matching the
#  city on the CV and writes its town list into the profile's filters.
#
#  Not in the list? Setup falls back to `generic`: the city name plus its
#  country's remote anchors. That works, it is just less forgiving about
#  suburbs, so add a metro entry if you live in one.
# ============================================================

metros:
  munich:
    label: Munich
    country: de
    aliases: [munich, münchen, muenchen, munchen]
    region: [bavaria, bayern]
    towns: [ottobrunn, taufkirchen, parsdorf, garching, oberpfaffenhofen, weßling, wessling,
