# Country-level anchors: a "remote" posting tied to one of these is still
# considered reachable, and the aggregators need the country code.
countries:
  de: {names: [germany, deutschland, europe, emea, dach], adzuna: de, language: de}
  at: {names: [austria, österreich, europe, emea, dach], adzuna: at, language: de}
  ch: {names: [switzerland, schweiz, suisse, europe, emea, dach], adzuna: ch, language: de}
  nl: {names: [netherlands, nederland, benelux, europe, emea], adzuna: nl, language: nl}
  uk: {names: [united kingdom, uk, england, britain, europe], adzuna: gb, language: en}
  fr: {names: [france, europe, emea], adzuna: fr, language: fr}
  es: {names: [spain, españa, europe, emea], adzuna: es, language: es}
  it: {names: [italy, italia, europe, emea], adzuna: it, language: it}
  tr: {names: [türkiye, turkey, turkiye, europe, emea], adzuna: null, language: tr}
  ie: {names: [ireland, europe, emea], adzuna: ie, language: en}
  se: {names: [sweden, sverige, nordics, europe, emea], adzuna: se, language: en}
  dk: {names: [denmark, danmark, nordics, europe, emea], adzuna: null, language: en}
  pl: {names: [poland, polska, europe, emea], adzuna: pl, language: pl}
  cz: {names: [czechia, czech republic, europe, emea], adzuna: null, language: cs}
  us: {names: [united states, usa, us, remote], adzuna: us, language: en}
  ca: {names: [canada, remote], adzuna: ca, language: en}

# Used when the CV's city matches no metro above.
generic:
  remote_anchors: [remote, anywhere, worldwide]
