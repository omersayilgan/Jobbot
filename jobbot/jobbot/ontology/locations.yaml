            kirchheim, feldkirchen, aschheim, planegg, martinsried, germering, puchheim,
            oberhaching, grünwald, gruenwald, dachau, freising, starnberg, gauting,
            fürstenfeldbruck, fuerstenfeldbruck, augsburg, olching, karlsfeld, haar, poing]
    region_excludes: [nuremberg, nürnberg, nuernberg, würzburg, wuerzburg, regensburg,
