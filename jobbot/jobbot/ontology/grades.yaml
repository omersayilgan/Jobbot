# ============================================================
#  Grade scales.
#
#  Transcripts are the most under-used document in a job search: they say
#  which subjects a person is demonstrably good at, which is exactly what
#  separates two postings that both look "relevant". To use them the tool has
#  to know which scale it is reading, because 1.0 is the best grade in Germany
#  and close to the worst in the US.
#
#  `markers`  strings whose presence identifies the scale
#  `values`   raw grade token -> performance in 0..1 (1 = best)
#  `pattern`  regex matching one grade token on a transcript line
#  `ignore`   pass/fail and administrative tokens that carry no performance
# ============================================================

scales:

  de_numeric:
    label: "German 1.0–5.0"
    markers: ["leistungsnachweis", "notenskala", "sehr gut", "befriedigend", "ausreichend",
              "nicht ausreichend", "modulhandbuch", "zwischennote", "prüfungsordnung",
              "notenspiegel", "gesamtnote"]
    pattern: '\b([1-5][.,][037])\b'
    best_is_low: true
    values:
      "1.0": 1.00
      "1.3": 0.95
      "1.7": 0.87
      "2.0": 0.78
      "2.3": 0.70
      "2.7": 0.58
      "3.0": 0.48
      "3.3": 0.38
      "3.7": 0.28
      "4.0": 0.18
      "5.0": 0.00
    ignore: ["be", "nb", "bestanden", "nicht bestanden", "anerkannt"]

  metu_letters:
    label: "Turkish AA–FF"
    markers: ["cumgpa", "high honor", "orta doğu teknik", "middle east technical",
              "stan:", " aa ", "öğrenci işleri"]
    pattern: '\b(AA|BA|BB|CB|CC|DC|DD|FD|FF|NA|EX|[SWI])\b'
    best_is_low: false
    values:
      AA: 1.00
      BA: 0.87
      BB: 0.75
      CB: 0.62
      CC: 0.50
      DC: 0.37
      DD: 0.25
      FD: 0.12
      FF: 0.00
    ignore: [S, W, I, EX, NA, U, P]

  us_letters:
    label: "US letter A–F"
    markers: ["grade point average", "gpa:", "quality points", "semester hours",
              "cumulative gpa", "credit hours"]
    pattern: '\b(A\+|A-|A|B\+|B-|B|C\+|C-|C|D\+|D-|D|F)\b'
    best_is_low: false
    values:
      "A+": 1.00
      "A": 0.95
      "A-": 0.88
      "B+": 0.80
      "B": 0.72
      "B-": 0.64
      "C+": 0.56
      "C": 0.48
      "C-": 0.40
      "D+": 0.32
      "D": 0.25
      "D-": 0.18
      "F": 0.00
    ignore: [P, NP, W, I, AU, CR, TR]

  ects_letters:
    label: "ECTS A–F"
    markers: ["ects grade", "ects-note", "european credit transfer"]
    pattern: '\b(A|B|C|D|E|FX|F)\b'
    best_is_low: false
    values: {A: 1.00, B: 0.82, C: 0.65, D: 0.48, E: 0.32, FX: 0.10, F: 0.00}
    ignore: [P, S]

  percent_100:
    label: "Percentage 0–100"
    markers: ["out of 100", "percentage", "über hundert", "over hundred", "/100", "marks obtained"]
    pattern: '\b(\d{1,3}(?:[.,]\d{1,2})?)\b'
    best_is_low: false
    numeric_range: [0, 100]
    ignore: []

  cgpa_10:
    label: "Indian CGPA 0–10"
    markers: ["cgpa", "sgpa", "out of 10", "grade point (10)"]
    pattern: '\b(10|[0-9](?:[.,]\d{1,2})?)\b'
    best_is_low: false
    numeric_range: [0, 10]
    ignore: []

# A course counts as demonstrated strength above `strong`, and as a subject to
# steer away from below `weak`. The band between the two is simply neutral.
thresholds:
  strong: 0.72
  weak: 0.45

# Words in a course row that mean "this is not a graded subject".
non_courses:
  - summer practice
  - occupational health
  - internship
  - praktikum
  - orientation
  - physical education
  - turkish
  - history of
  - principles of kemal
  - english for academic
  - academic oral
  - basic english
  - semester total
  - cumulative
  - grand total
  - credits earned
